[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbflow"
version = "0.1.0"
description = "Local-first automated PCB development workflow"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "mcp>=1.0,<3",
  "ortools>=9.14,<10",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "sqlalchemy>=2.0.36,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
pcbflow = "pcbflow.cli:app"
pcbflow-mcp = "pcbflow.mcp_server:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "kicad: requires a real supported kicad-cli",
  "lceda_pro: requires a verified official LCEDA Pro automation bridge",
]
