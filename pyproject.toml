[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbflow"
version = "0.1.0"
description = "Local-first automated PCB development workflow"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "mcp>=1.0,<3",
  "ortools>=9.14,<10",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "sqlalchemy>=2.0.36,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<3",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-timeout>=2.3,<3",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.16,<0.17",
]

[project.scripts]
pcbflow = "pcbflow.cli:app"
pcbflow-mcp = "pcbflow.mcp_server:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath makes "from tests.component_fixtures import ..." work for any
# pytest entry point (python -m pytest and the console script alike).
pythonpath = ["."]
addopts = "-ra --strict-markers --timeout=600"
markers = [
  "kicad: requires a real supported kicad-cli",
  "lceda_pro: requires a verified official LCEDA Pro automation bridge",
]

[tool.ruff]
line-length = 200
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E4/E7/E9 = pycodestyle practical subset, F = pyflakes, I = import ordering,
# B = bugbear (real-bug patterns), SIM = simplification, UP = pyupgrade.
# BLE001 (blind except) stays off on purpose: the fail-closed architecture
# uses broad `except Exception` boundaries that convert failures into stable
# error codes; narrowing them would change observable behavior.
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# The package __init__ suppresses deprecation warnings before re-exporting.
"src/pcbflow/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Enforced: the package type-checks clean; keep it that way.

