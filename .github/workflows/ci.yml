name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests

  test:
    # The project is Windows-first (PowerShell workflows, Windows process
    # management); tests are validated on Windows. KiCad contract tests
    # skip automatically when kicad-cli is absent from the runner.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The codebase guards Windows/POSIX names behind os.name checks that
      # mypy does not fold, so type-check on the project's primary platform.
      - run: mypy src/pcbflow
      - run: pytest -q -n auto --cov=pcbflow --cov-report=term --cov-fail-under=88
